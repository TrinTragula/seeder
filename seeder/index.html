<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Legacy share links are /?seed=X&version=Y: the landing entry replaces them with /seed/…
         before React mounts. Hiding the body meanwhile stops the landing from flashing, and the
         GA snippet in head-common.html reads the flag so the view is only counted on /seed/.
         Only a decimal seed is redirected (the same test as src/shared/legacy.js), so a text
         seed keeps the landing visible and counted. -->
    <script>window.__legacyRedirect = /^[+-]?\d+$/.test((new URLSearchParams(location.search).get('seed') || '').trim()); if (window.__legacyRedirect) document.documentElement.classList.add('redirecting');</script>
    <style>.redirecting body { visibility: hidden }</style>
    <!-- @include head-common.html -->
    <title>Seeder - Minecraft seed finder and analyzer</title>
    <meta name="description" content="Search and analyze any Minecraft seed. Discover biomes and structures, find seeds with the biomes you want. All in your browser!" />
    <meta property="og:title" content="Seeder - Minecraft seed finder and analyzer" />
    <meta property="og:description" content="Search and analyze any Minecraft seed. Discover biomes and structures, find seeds with the biomes you want. All in your browser!" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta name="twitter:title" content="Seeder - Minecraft seed finder and analyzer" />
    <meta name="twitter:description" content="Search and analyze any Minecraft seed. Discover biomes and structures, find seeds with the biomes you want. All in your browser!" />
    <link rel="canonical" href="__SITE_URL__/" />
</head>

<body>
    <noscript>The map and finder need JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/landing/main.jsx"></script>
</body>

</html>
