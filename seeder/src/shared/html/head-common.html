<!-- The seed page's and the finder's prerendered intro (StaticIntro) and the footer under it are
     for crawlers and visitors without JavaScript, who see them at once. With JavaScript on they stay
     invisible until the app replaces them, so a visitor sees the header (the same in both) and then
     the app; they fade in after 3s only if the app never arrived. Inline, so it holds before any
     stylesheet has loaded (the dev server injects styles from JS). -->
<script>document.documentElement.classList.add('js')</script>
<style>
    .js .static-intro, .js main:has(> .static-intro) ~ .site-footer { animation: static-fallback 220ms ease-out 3s both }
    @keyframes static-fallback { from { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .js .static-intro, .js main:has(> .static-intro) ~ .site-footer { animation-duration: 0ms } }
</style>
